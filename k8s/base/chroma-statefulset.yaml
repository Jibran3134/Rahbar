apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: rahbar
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chroma
      app.kubernetes.io/part-of: rahbar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chroma
        app.kubernetes.io/part-of: rahbar
    spec:
      serviceAccountName: chroma
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 140
      containers:
      - name: chroma
        image: chromadb/chroma:1.0.12@sha256:28a3b2c05c74c83686c2273d4d0994b80c481805d0f47887f289c53a4616e592
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1536Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: ANONYMIZED_TELEMETRY
          value: 'False'
        - name: HOME
          value: /tmp
        readinessProbe:
          httpGet:
            path: /api/v2/heartbeat
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 4
        livenessProbe:
          httpGet:
            path: /api/v2/heartbeat
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 4
        startupProbe:
          httpGet:
            path: /api/v2/heartbeat
            port: http
          periodSeconds: 2
          failureThreshold: 60
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 4Gi
