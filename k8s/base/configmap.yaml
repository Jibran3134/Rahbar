apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
data:
  RETRIEVER: chroma
  LLM_PROVIDER: hosted
  EMBED_MODEL: nomic-embed-text
  LLM_MODEL: openai/gpt-oss-120b
  OLLAMA_URL: http://host.minikube.internal:11434
  HOSTED_BASE_URL: https://api.groq.com/openai/v1
  CHROMA_HOST: chroma
  CHROMA_PORT: '8000'
  CHROMA_COLLECTION: rahbar
  REDIS_URL: redis://redis:6379/0
  CORPUS_DIR: /corpus
  CHUNK_SIZE: '250'
  CHUNK_OVERLAP: '30'
  TOP_K: '5'
  RELEVANCE_FLOOR: '0.70'
  CACHE_THRESHOLD: '0.95'
  CACHE_TTL_SECONDS: '3600'
  CACHE_MAX_ENTRIES: '256'
  SESSION_TTL_SECONDS: '1800'
  TEMPERATURE: '0.2'  # 0.2: low temperature for stable grounded structured outputs; avoids hallucination drift
  LLM_TIMEOUT_SECONDS: '180'
  LOG_LEVEL: INFO
