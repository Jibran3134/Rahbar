name: Verify
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install pinned dependencies
      run: python -m pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
    - run: |-
        python -m ruff check api indexer eval corpus scripts
        (cd api && python -m mypy app)
        (cd indexer && python -m mypy pipeline)
        node scripts/ui.test.cjs
    - name: Validate GitHub workflows
      run: |-
        python scripts/bootstrap_tools.py actionlint
        .venv/tools/bin/actionlint
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install pinned dependencies
      run: python -m pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
    - run: |-
        mkdir -p artifacts
        (cd api && python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml:../artifacts/api-coverage.xml --cov-fail-under=60)
        (cd indexer && python -m pytest -q --cov=pipeline --cov-report=term-missing --cov-report=xml:../artifacts/indexer-coverage.xml --cov-fail-under=60)
        python -m pytest -q eval/tests scripts/tests
        python -m pip check
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: coverage
        path: artifacts/
        if-no-files-found: warn
        retention-days: 1
  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install pinned dependencies
      run: python -m pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
    - run: |-
        python scripts/bootstrap_tools.py kubeconform
        python scripts/check_platform.py
    - name: Strict kubeconform
      run: |-
        set -euo pipefail
        for overlay in dev prod ci; do
          kubectl kustomize "k8s/overlays/$overlay" | kubeconform -strict -summary -kubernetes-version 1.35.0
        done
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
    - lint
    - test
    - manifests
    strategy:
      fail-fast: false
      matrix:
        image:
        - api
        - indexer
        - ui
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: Build without publishing
      run: |-
        docker build --tag "rahbar-${{ matrix.image }}:${{ github.sha }}" "${{ matrix.image }}"
        mkdir -p artifacts
        docker save "rahbar-${{ matrix.image }}:${{ github.sha }}" --output "artifacts/${{ matrix.image }}.tar"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: image-${{ matrix.image }}
        path: artifacts/${{ matrix.image }}.tar
        retention-days: 1
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
    - build
    strategy:
      fail-fast: false
      matrix:
        image:
        - api
        - indexer
        - ui
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: |-
        python -m pip install httpx==0.28.1
        python scripts/bootstrap_tools.py trivy
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: image-${{ matrix.image }}
        path: artifacts
    - name: Trivy fixable HIGH/CRITICAL gate
      run: |-
        docker load --input "artifacts/${{ matrix.image }}.tar"
        trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format json --output "artifacts/${{ matrix.image }}-scan.json" "rahbar-${{ matrix.image }}:${{ github.sha }}"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: scan-${{ matrix.image }}
        path: artifacts/*-scan.json
        if-no-files-found: warn
        retention-days: 1
  e2e-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs:
    - scan
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install pinned dependencies
      run: python -m pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
    - run: python scripts/bootstrap_tools.py kind --manifests
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: image-*
        path: artifacts
        merge-multiple: true
    - run: |-
        for image in artifacts/*.tar; do docker load --input "$image"; done
        python -u scripts/ci_e2e.py --tag "${{ github.sha }}"
      name: Real fixture index, Ingress and eval/run_eval.py gate
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: e2e-evidence
        path: |-
          .venv/e2e/*.json
          .venv/e2e/*.txt
        if-no-files-found: warn
        retention-days: 1
