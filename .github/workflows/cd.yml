name: CD
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: rahbar-release
  cancel-in-progress: false
env:
  REGISTRY: docker.io/jibran3134
jobs:
  test:
    uses: ./.github/workflows/verify.yml
    if: github.ref == 'refs/heads/main'
  build-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
    - test
    strategy:
      matrix:
        image:
        - api
        - indexer
        - ui
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: image-${{ matrix.image }}
        path: artifacts
    - name: Publish the exact scanned image
      run: |-
        docker load --input "artifacts/${{ matrix.image }}.tar"
        docker tag "rahbar-${{ matrix.image }}:${{ github.sha }}" "$REGISTRY/rahbar-${{ matrix.image }}:${{ github.sha }}"
        docker push "$REGISTRY/rahbar-${{ matrix.image }}:${{ github.sha }}"
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs:
    - build-push
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install pinned dependencies
      run: python -m pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - run: python scripts/bootstrap_tools.py kind --manifests
    - name: Pull exact tested SHA images
      run: |-
        for image in api indexer ui; do
         docker pull "$REGISTRY/rahbar-$image:${{ github.sha }}"
        done
    - name: Rollout, Ingress smoke and eval/run_eval.py
      run: |-
        python -u scripts/ci_e2e.py --tag "${{ github.sha }}" --registry "$REGISTRY"
        kubectl rollout status deployment/api -n rahbar --kubeconfig .venv/e2e/kubeconfig --context kind-rahbar-ci --timeout=300s
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: release-evidence
        path: |-
          .venv/e2e/*.json
          .venv/e2e/*.txt
        if-no-files-found: warn
